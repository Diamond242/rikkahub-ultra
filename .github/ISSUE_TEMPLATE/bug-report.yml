name: Bug Report
description: Report a bug or crash in the app · گزارش باگ یا کرش برنامه
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible so we can reproduce and fix it.
        ممنون که باگ را گزارش می‌کنید! لطفاً تا جای ممکن جزئیات را کامل بنویسید تا بتوانیم مشکل را بازسازی و رفع کنیم.

        > **Note · توجه**
        > Do not submit AI-generated issues — they will be closed without review.
        > لطفاً Issue تولیدشده با هوش مصنوعی ثبت نکنید؛ این Issueها بدون بررسی بسته می‌شوند.

  - type: textarea
    id: description
    attributes:
      label: Problem Description | شرح مشکل
      description: Describe the issue in detail, including steps to reproduce. / مشکل را با جزئیات و مراحل بازسازی آن توضیح دهید.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. ... happens
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior | رفتار مورد انتظار
      description: What did you expect to happen? / انتظار داشتید چه اتفاقی بیفتد؟
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots | تصاویر
      description: Attach relevant screenshots or screen recordings here. / تصویر یا ویدیوی مرتبط را اینجا قرار دهید.
    validations:
      required: false

  - type: input
    id: provider
    attributes:
      label: Provider | ارائه‌دهنده
      description: e.g. OpenAI, Anthropic, Google, AvalAI, local deployment
      placeholder: OpenAI
    validations:
      required: false

  - type: input
    id: model
    attributes:
      label: Model | مدل
      description: e.g. gpt-4o, claude-3-5-sonnet
      placeholder: gpt-4o
    validations:
      required: false

  - type: dropdown
    id: api-type
    attributes:
      label: API Type | نوع API
      description: The API protocol type being used / نوع پروتکل API
      options:
        - OpenAI ChatCompletion
        - Response API
        - Google Gemini
        - Anthropic
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: App Version | نسخهٔ برنامه
      description: Settings › About › Version, e.g. 3.1.1-ultra.1
      placeholder: 3.1.1-ultra.1
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android Version | نسخهٔ اندروید
      description: e.g. Android 14
      placeholder: Android 14
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: Device Model | مدل گوشی
      description: e.g. Samsung Galaxy A54, Xiaomi 14
      placeholder: Xiaomi 14
    validations:
      required: true