name: Feature Request
description: Request a new feature · درخواست قابلیت تازه
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > **Note · توجه**
        > Whether a feature request is accepted depends on its necessity and impact on the codebase — not all requests will be accepted.
        > پذیرفته شدن درخواست به ضرورت آن و اثرش بر کد بستگی دارد و همهٔ درخواست‌ها پذیرفته نمی‌شوند.

  - type: textarea
    id: description
    attributes:
      label: Feature Description | شرح قابلیت
      description: Describe the new feature you are requesting. / قابلیتی را که می‌خواهید با جزئیات توضیح دهید.
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: Usage Scenario | سناریوی استفاده
      description: Describe when this feature would be used and how it would help you. / این قابلیت کجا به کار می‌آید و چه کمکی به شما می‌کند؟
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered | راه‌حل‌های جایگزین
      description: Are there any alternative solutions or workarounds you have considered? / آیا راه‌حل جایگزینی سراغ دارید؟
    validations:
      required: false