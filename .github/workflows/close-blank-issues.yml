name: Close Blank Issues

on:
  issues:
    types: [opened]

jobs:
  close-blank-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.issue.user.login;
            const isOwner = author === context.repo.owner;

            const body = context.payload.issue.body;
            // Section labels of our issue templates (bug report, feature request, sponsor listing)
            const templateMarkers = ['Problem Description', 'Feature Description', 'Sponsor Name'];
            const usedTemplate = body && templateMarkers.some(marker => body.includes(marker));

            if (!isOwner && !usedTemplate) {
              const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: [
                  'ممنون از بازخورد شما! این Issue با قالب رسمی ثبت نشده بود و به‌طور خودکار بسته شد.',
                  'لطفاً با یکی از قالب‌های زیر دوباره ثبت کنید:',
                  '',
                  `- 🐛 [گزارش باگ](${repoUrl}/issues/new?template=bug-report.yml)`,
                  `- ✨ [درخواست قابلیت](${repoUrl}/issues/new?template=feature-request.yml)`,
                  '',
                  '---',
                  '',
                  'Thanks for your feedback! This issue was closed because it was not submitted using the official template.',
                  'Please resubmit using one of the templates below:',
                  '',
                  `- 🐛 [Bug Report](${repoUrl}/issues/new?template=bug-report.yml)`,
                  `- ✨ [Feature Request](${repoUrl}/issues/new?template=feature-request.yml)`,
                  `- 💚 [Sponsor Listing](${repoUrl}/issues/new?template=sponsor-listing.yml)`,
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed',
              });
            }
