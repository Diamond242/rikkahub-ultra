name: Daily Build

on:
  # Runs every day at 09:00 and 18:00 UTC
  schedule:
    - cron: '0 9,18 * * *'
  # Can also be started manually
  workflow_dispatch:

jobs:
  # Skip the build when there was no commit in the last 24 hours, to avoid duplicate packages
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          # Manual runs always build
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled runs build only when there are commits from the last 24 hours
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the last 24 hours, skipping the build"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # fetch submodules

      # Same JetBrains Runtime 21 that ships with Android Studio
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          # the JetBrains installer queries the GitHub API; the token avoids rate limits
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # preBuild of the web module runs `pnpm run build` for the web UI, so Node and pnpm are required
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # the Gradle buildWebUi task only builds, so install the web UI dependencies here
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          # decode the base64 encoded keystore
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # write the signing config to local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

          # write the Google Services config
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease

      # Publish the APKs as a prerelease so users can download a single APK without signing in or unzipping.
      # Prereleases are ignored by the in-app update checker (it reads /releases/latest).
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly            # fixed tag: every run replaces the same "latest nightly build"
          name: Nightly Build
          prerelease: true
          body: |
            Automatic nightly build (commit `${{ github.sha }}`)

            > ⚠️ Development build: it may be unstable and is meant for testing only.
          # mapping.txt de-obfuscates crash stack traces; one file is shared by the APKs of every ABI
          files: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/mapping/githubRelease/mapping.txt
